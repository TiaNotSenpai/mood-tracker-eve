<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mood Check</title>
    <!-- Carichiamo la libreria Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .emoji-btn { font-size: 35px; background: none; border: none; cursor: pointer; opacity: 0.3; }
        .emoji-btn.selected { opacity: 1; transform: scale(1.2); }
        
        #send-btn {
            background-color: #3390ec; color: #fff;
            width: 100%; padding: 15px;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="text-align:center">Test Diagnostico</h3>
        <div style="display:flex; justify-content:space-around">
            <button class="emoji-btn" onclick="selectEmoji('🟢', this)">🟢</button>
            <button class="emoji-btn" onclick="selectEmoji('🟡', this)">🟡</button>
            <button class="emoji-btn" onclick="selectEmoji('🔵', this)">🔵</button>
        </div>
        <p id="debug-text" style="text-align:center; color:red; font-size:12px; margin-top:10px;">Attesa azione...</p>
    </div>

    <button id="send-btn" onclick="trySend()">INVIA (TEST)</button>

    <script>
        // 1. Diciamo al browser di urlare se c'è un errore
        window.onerror = function(msg, url, line) {
            alert("ERRORE DI SISTEMA:\n" + msg + "\nRiga: " + line);
            document.getElementById('debug-text').innerText = "ERRORE: " + msg;
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Verifica immediata che Telegram ci sia
        if (!tg) {
            alert("ATTENZIONE: Non vedo Telegram. Sei sul browser normale?");
        } else {
            // alert("Telegram connesso correttamente v" + tg.version); // Decommenta se serve
        }

        let selectedStatus = null;

        function selectEmoji(emoji, btn) {
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedStatus = emoji;
            document.getElementById('debug-text').innerText = "Selezionato: " + emoji;
        }

        function trySend() {
            // STEP 1: Il click funziona?
            alert("Step 1: Click ricevuto.");

            if (!selectedStatus) {
                alert("Seleziona prima un'emoji!");
                return;
            }

            // Dati finti per il test
            const data = {
                status: selectedStatus,
                cause: "Test",
                contact: "Test",
                severity: "Test"
            };

            // STEP 2: Invio dati
            try {
                alert("Step 2: Provo a inviare a Telegram...");
                tg.sendData(JSON.stringify(data));
                
                // Se arrivi qui, il comando è partito
                alert("Step 3: Comando inviato! La finestra dovrebbe chiudersi.");
                
            } catch (e) {
                alert("ERRORE DURANTE L'INVIO: " + e.message);
            }
        }
    </script>
</body>
</html>
