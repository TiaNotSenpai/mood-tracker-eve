<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #000);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 16px; padding: 20px; width: 100%;
            margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; font-size: 16px; opacity: 0.7; text-align: center; }
        
        .emoji-row { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .emoji-btn {
            font-size: 38px; background: transparent; border: none;
            opacity: 0.4; transition: all 0.2s; cursor: pointer; padding: 5px;
        }
        .emoji-btn.selected { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 5px rgba(0,0,0,0.2)); }

        .toggle-row {
            display: flex; background: rgba(0,0,0,0.05);
            border-radius: 10px; padding: 4px; margin-bottom: 12px;
        }
        .toggle-opt {
            flex: 1; text-align: center; padding: 10px; font-size: 13px;
            border-radius: 8px; cursor: pointer; font-weight: 500;
        }
        .toggle-opt.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #send-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: #fff; font-size: 17px; font-weight: bold;
            opacity: 0.5; pointer-events: none; transition: opacity 0.3s;
        }
        #send-btn.ready { opacity: 1; pointer-events: all; cursor: pointer; }
    </style>
</head>
<body>

    <!-- STATO -->
    <div class="card">
        <h3>Come stai?</h3>
        <div class="emoji-row">
            <button class="emoji-btn" onclick="setEmoji('🟢')">🟢</button>
            <button class="emoji-btn" onclick="setEmoji('🟡')">🟡</button>
            <button class="emoji-btn" onclick="setEmoji('🔵')">🔵</button>
        </div>
        <p id="status-desc" style="text-align:center; min-height:20px; font-size:14px; margin:0;"></p>
    </div>

    <!-- DETTAGLI -->
    <div class="card">
        <h3>Contesto (Opzionale)</h3>
        <div class="toggle-row" id="cause">
            <div class="toggle-opt" onclick="setOpt('cause', 'Voi due', this)">Noi due</div>
            <div class="toggle-opt" onclick="setOpt('cause', 'Esterno', this)">Esterno</div>
        </div>
        <div class="toggle-row" id="contact">
            <div class="toggle-opt" onclick="setOpt('contact', 'Lasciami sola', this)">Lasciami sola</div>
            <div class="toggle-opt" onclick="setOpt('contact', 'Scrivimi', this)">Scrivimi</div>
        </div>
        <div class="toggle-row" id="severity">
            <div class="toggle-opt" onclick="setOpt('severity', 'Grave', this)">Grave</div>
            <div class="toggle-opt" onclick="setOpt('severity', 'Gestibile', this)">Gestibile</div>
        </div>
    </div>

    <button id="send-btn" onclick="sendToTelegram()">INVIA A LUI</button>

    <script>
        // --- ⚠️ RIMETTI I TUOI DATI QUI ⚠️ ---
        const BOT_TOKEN = "8423305789:AAH1AJaHbzgOdt9mCJE9pV3NNA25f7t5EaA"; 
        const CHAT_ID_FIDANZATO = "834109794";
        // -------------------------------------

        let tg = window.Telegram.WebApp;
        tg.expand();

        let payload = { status: null, cause: "-", contact: "-", severity: "-" };

        function setEmoji(e) {
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            payload.status = e;
            
            let txt = e === '🟢' ? "Tutto ok" : e === '🟡' ? "Sto elaborando" : "Ho bisogno di spazio";
            document.getElementById('status-desc').innerText = txt;
            document.getElementById('send-btn').classList.add('ready');
        }

        function setOpt(key, val, el) {
            el.parentNode.querySelectorAll('.toggle-opt').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            payload[key] = val;
        }

        function sendToTelegram() {
            // Controlla che i dati siano stati inseriti
            if (BOT_TOKEN.includes("INCOLLA") || CHAT_ID_FIDANZATO.includes("INCOLLA")) {
                alert("ERRORE: Non hai modificato il Token o l'ID nel codice!");
                return;
            }

            const btn = document.getElementById('send-btn');
            btn.innerText = "Invio in corso..."; // Feedback visivo
            btn.style.opacity = "0.7";

            const textForYou = `🚨 **AGGIORNAMENTO**\n\nStato: ${payload.status}\n----------------\n❓ Causa: ${payload.cause}\n💬 Contatto: ${payload.contact}\n⚠️ Livello: ${payload.severity}`;

            // URL per inviare il messaggio
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    chat_id: CHAT_ID_FIDANZATO, 
                    text: textForYou, 
                    parse_mode: 'Markdown' 
                })
            })
            .then(response => {
                if (response.ok) {
                    // SE è andato tutto bene, ORA chiudiamo
                    tg.close();
                } else {
                    // Se Telegram dice no (es. ID sbagliato)
                    alert("Errore Telegram: " + response.status);
                    btn.innerText = "Riprova";
                }
            })
            .catch(error => {
                // Se manca internet o altro
                alert("Errore di connessione: " + error);
                btn.innerText = "Riprova";
            });
        }
    </script>
</body>
</html>
